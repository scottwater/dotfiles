# External files managed outside the main dotfiles repo
# These are pulled during `chezmoi apply`

# Dracula Pro is intentionally disabled while Tokyo Night Dark is active.
# Re-enable instructions live in README.md. Keep this block as the source hint.
# [".config/nvim/dracula_pro"]
#     type = "git-repo"
#     url = "git@github.com:scottwater/dracula-pro-nvim.git"
#     refreshPeriod = "168h"
#     [".config/nvim/dracula_pro".pull]
#         args = ["--ff-only"]

# Tmux Plugin Manager
[".tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm.git"
    refreshPeriod = "168h"

# Pure prompt
[".zsh/pure"]
    type = "git-repo"
    url = "https://github.com/sindresorhus/pure.git"
    refreshPeriod = "168h"

# Zsh plugins (previously installed via Homebrew/apt)
[".zsh/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "168h"

[".zsh/zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "168h"

{{ if eq .chezmoi.os "darwin" -}}
# Nerd Fonts (previously Homebrew casks)
["Library/Fonts/HackNerdFont"]
    type = "archive"
    url = "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Hack.zip"
    refreshPeriod = "720h"

["Library/Fonts/SymbolsNerdFont"]
    type = "archive"
    url = "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.zip"
    refreshPeriod = "720h"
{{- end }}
