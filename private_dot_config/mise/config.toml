[tools]
# Runtimes
bun = "latest"
fnox = "latest"
go = "latest"
herdr = "latest"
node = "24.19.0"
php = "8.4.25" # compiles from source; build deps in Brewfile; installs composer too
ruby = "4.0.6"
tuist = "4.195.6"

# CLI tools (cross-platform, replaces Homebrew/apt installs)
age = "latest"
bat = "latest"
delta = "latest"
flyctl = "latest"
gh = "latest"
git-filter-repo = "latest"
glow = "latest"
lazygit = "latest"
neovim = "latest"
overmind = "latest"
ripgrep = "latest"
yazi = "latest"
zoxide = "latest"
"npm:hunkdiff" = { version = "latest", trust_policy_excludes = ["@pierre/theme@2.0.0"] }
"pipx:dslr" = { version = "latest", uvx_args = "--with psycopg2-binary" }
"ubi:axllent/mailpit" = "latest"
"ubi:rtk-ai/rtk" = "latest"

[settings]

[settings.ruby]
compile = false
