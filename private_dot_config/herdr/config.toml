onboarding = false
# herdr configuration — https://herdr.dev/docs/configuration/
# Reload with: herdr server reload-config

[theme]
# Inherit the terminal's palette (Ghostty defines Dracula Pro Alucard).
name = "terminal"

[theme.custom]
# Blend the main chrome into Alucard's light background, then rebuild hierarchy
# with surface/overlay tokens so sidebar, tabs, and dividers still read clearly.
panel_bg = "reset"
# Soft cool-gray ladder on top of #F5F5F5 so UI chrome separates without a dark theme fill.
surface0 = "#ECECF2"
surface1 = "#E0E0EC"
surface_dim = "#E8E8F0"
# Divider / border contrast between sidebar and work area, and around tabs.
overlay0 = "#C5C5D4"
overlay1 = "#A8A8BA"
# Primary + muted text. subtext0 is used for inactive tabs/secondary labels.
text = "#1F1F1F"
subtext0 = "#5C5C6A"
# Alucard purple, matching zsh completion/autosuggest highlights.
accent = "#644AC9"
red = "#CB3A2A"
green = "#14710A"
yellow = "#846E15"
blue = "#036A96"

[ui]
# Keep the active accent on borders/highlights explicit (same as theme.custom.accent).
accent = "#644AC9"
# Make split panes and chrome edges a bit more intentional.
pane_borders = true
pane_gaps = true

# Space entries: bold name, dim branch, and a blank row between each space.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [{ token = "branch", dim = true, fg = "#5C5C6A" }, "git_status"],
]

# Agent entries: same spacing so the lower panel doesn't look like loose text.
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", bold = true }, "tab"],
  [{ token = "agent", dim = true, fg = "#5C5C6A" }],
]

# NOTE: this table must stay above the [[keys.command]] blocks below. In TOML,
# bare keys after an array-of-tables land inside that table, and herdr rejects
# them as unknown keys.
[keys]
# Prefix stays on the default ctrl+b: ctrl+a is readline beginning-of-line.

# Focus agent rows 1-9 directly. Default is alt+1..9, which macOS eats for
# Spaces before the terminal ever sees it.
focus_agent = "ctrl+1..9"

switch_workspace = "prefix+shift+1..9"
# lazygit popup, same binding and size as tmux (bind g)
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

# lazygit popup, same binding and size as tmux (bind g)
[[keys.command]]
key = "prefix+shift+h"
type = "popup"
command = "hunk diff"
description = "run hunk"
width = "80%"
height = "80%"

# yazi popup, same binding and size as tmux (bind F)
[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "yazi"
description = "run yazi"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[experimental]
kitty_graphics = true
